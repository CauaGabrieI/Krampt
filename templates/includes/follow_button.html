<form method="post" action="{% url 'profile:seguir' usuario.pk %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" name="desired_state" value="{% if usuario.pk in seguindo_ids %}0{% else %}1{% endif %}">
  <button class="follow-button{% if usuario.pk in seguindo_ids %} is-following{% endif %}" type="submit">
    {% if usuario.pk in seguindo_ids %}Seguindo{% else %}Seguir{% endif %}
  </button>
</form>
