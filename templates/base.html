{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Krampt{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'imgs/logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v=editorial-2">
  <link rel="stylesheet" href="{% static 'css/krampt.css' %}?v=profile-links-2">
  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="{% static 'css/editorial.css' %}?v=2">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script src="{% static 'js/krampt.js' %}?v=2" defer></script>
  <script src="{% static 'js/post_carousel.js' %}?v=2" defer></script>
</body>
</html>
